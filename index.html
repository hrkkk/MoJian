 <!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>墨笺 · 所见即所得 Markdown 编辑器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div><strong>墨笺</strong><span>Markdown Editor</span></div>
        </div>
        <div class="document-title">
          <input id="document-name" value="未命名文档" aria-label="文档名称" />
          <span id="save-state">未保存</span>
        </div>
        <div class="topbar-actions">
          <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />
          <button class="button primary" id="new-file-button" type="button">新建文件</button>
          <button class="button primary" id="save-file-button" type="button">保存文件</button>
          <button class="button ghost" id="open-folder-button" type="button">打开文件夹</button>
          <button class="button ghost" id="open-button" type="button">打开文件</button>
          <button class="icon-button" id="settings-button" type="button" aria-label="设置">⚙</button>
          <button class="icon-button" id="theme-button" type="button" aria-label="切换主题">☾</button>
        </div>
      </header>

      <nav class="toolbar" aria-label="Markdown 格式工具">
        <div class="format-tools">
          <button type="button" data-action="heading" title="标题">H</button>
          <button type="button" data-action="bold" title="粗体"><strong>B</strong></button>
          <button type="button" data-action="italic" title="斜体"><em>I</em></button>
          <button type="button" data-action="strike" title="删除线"><s>S</s></button>
          <span class="divider"></span>
          <button type="button" data-action="quote" title="引用">❝</button>
          <button type="button" data-action="code" title="行内代码">&lt;/&gt;</button>
          <button type="button" data-action="link" title="链接">↗</button>
          <button type="button" data-action="bullet" title="无序列表">•≡</button>
          <button type="button" data-action="number" title="有序列表">1.</button>
          <button type="button" data-action="task" title="任务列表">☑</button>
          <button type="button" data-action="table" title="表格">▦</button>
          <button type="button" data-action="block-code" title="代码块">{ }</button>
          <span class="divider"></span>
          <button type="button" data-action="clear-format" title="清除格式">Tx</button>
        </div>
        <div class="mode-switcher">
          <button class="active" type="button" data-mode="visual">所见即所得</button>
          <button type="button" data-mode="source">源码</button>
        </div>
      </nav>

      <main class="workspace">
        <aside class="explorer" id="explorer">
          <div class="explorer-header">
            <span>资源管理器</span>
            <button id="refresh-tree-button" type="button" aria-label="刷新文件树" title="刷新文件树">↻</button>
          </div>
          <div class="folder-name" id="folder-name">尚未打开文件夹</div>
          <div class="file-tree" id="file-tree">
            <button class="empty-tree-action" id="empty-tree-action" type="button">打开一个文件夹</button>
          </div>
        </aside>
        <section class="editor-pane">
          <section class="editor-surface">
            <div id="visual-editor" class="markdown-body" aria-label="所见即所得 Markdown 编辑器"></div>
            <textarea id="source-editor" spellcheck="false" aria-label="Markdown 源码编辑器"></textarea>
          </section>
        </section>
      </main>

      <footer class="statusbar">
        <span id="editor-state">所见即所得模式</span>
        <div><span id="word-count">0 字</span><span id="block-count">0 个段落</span><span>Markdown</span></div>
      </footer>
    </div>

    <div class="settings-modal" id="settings-modal" aria-hidden="true">
      <div class="settings-backdrop" data-close-settings></div>
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="settings-panel-header">
          <div>
            <h2 id="settings-title">设置</h2>
            <p>调整启动行为和编辑器显示效果。</p>
          </div>
          <button class="icon-button" id="settings-close-button" type="button" aria-label="关闭设置">×</button>
        </header>

        <div class="settings-section">
          <h3>启动应用后</h3>
          <label class="radio-row">
            <input type="radio" name="startup-behavior" value="last-folder" />
            <span>打开上次打开的文件夹</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="startup-behavior" value="last-file" />
            <span>打开上次打开的文件</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="startup-behavior" value="new-file" />
            <span>打开新文件</span>
          </label>
          <p class="settings-note">自动恢复文件夹或文件需要桌面端权限；网页端会回退到本地缓存或新文件。</p>
        </div>

        <div class="settings-section">
          <h3>保存</h3>
          <label class="checkbox-row">
            <input id="auto-save-setting" type="checkbox" />
            <span>自动保存</span>
          </label>
        </div>

        <div class="settings-section">
          <h3>编辑器字体</h3>
          <label class="field-row">
            <span>字体</span>
            <select id="font-family-setting">
              <option value='"Open Sans", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif'>默认无衬线</option>
              <option value='"Microsoft YaHei", "Segoe UI", system-ui, sans-serif'>微软雅黑</option>
              <option value='"Segoe UI", "Microsoft YaHei", system-ui, sans-serif'>Segoe UI</option>
              <option value='Georgia, "Times New Roman", serif'>Georgia</option>
              <option value='"Cascadia Code", Consolas, monospace'>Cascadia Code</option>
            </select>
          </label>
          <label class="field-row">
            <span>字号</span>
            <input id="font-size-setting" type="number" min="12" max="28" step="1" />
          </label>
        </div>

        <footer class="settings-panel-footer">
          <button class="button ghost" id="settings-reset-button" type="button">恢复默认</button>
          <button class="button primary" id="settings-save-button" type="button">保存</button>
        </footer>
      </section>
    </div>
    <div class="confirm-modal" id="unsaved-modal" aria-hidden="true">
      <div class="confirm-backdrop"></div>
      <section class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="unsaved-title">
        <h2 id="unsaved-title">保存更改？</h2>
        <p>当前文件有未保存的修改，关闭前要保存吗？</p>
        <footer class="confirm-actions">
          <button class="button primary" type="button" data-unsaved-action="save">保存</button>
          <button class="button ghost" type="button" data-unsaved-action="discard">不保存</button>
          <button class="button ghost" type="button" data-unsaved-action="cancel">取消</button>
        </footer>
      </section>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
