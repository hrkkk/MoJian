[package]
name = "mojian"
version = "0.1.0"
description = "Mojian Markdown Editor"
authors = ["mtuser"]
edition = "2021"

[lib]
name = "mojian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
